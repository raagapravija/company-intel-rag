[project]
name = "company-intel-rag"
version = "0.1.0"
description = "Hybrid RAG over a Neo4j knowledge graph of SEC filings, financials and news"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Storage + retrieval
    "neo4j>=5.20",
    "neo4j-graphrag>=1.0",
    # Embeddings, reranking, LLM
    "voyageai>=0.3",
    "anthropic>=0.40",
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # Ingestion
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    # Config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # Serving
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
eval = [
    # Ragas API changes between releases: the exact version is pinned in uv.lock.
    "ragas>=0.2",
    "langfuse>=2.0",
    "pandas>=2.0",
]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Neo4j instance and API keys"]
addopts = "-m 'not integration'"
